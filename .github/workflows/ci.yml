name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff critical errors
        run: ruff check . --select E9,F63,F7,F82
      - name: Ruff release modules
        run: >-
          ruff check
          app/__init__.py
          app/config.py
          app/main.py
          app/maintenance.py
          app/daily_rewards.py
          app/button_ui/daily.py
          app/button_ui/router.py
          tests/test_maintenance_v41.py
          tests/test_daily_rewards_v42.py
          --ignore E501
      - name: Tests
        run: pytest -q
