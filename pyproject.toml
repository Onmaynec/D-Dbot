[project]
name = "dnd-telegram-master"
version = "4.6.0"
description = "Button-driven D&D Telegram master with multiplayer combat, party support, and SQLite"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.30.0,<4.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "Pillow>=10.4.0,<12.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
